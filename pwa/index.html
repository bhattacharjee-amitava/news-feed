<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WorldSignal">
  <meta name="description" content="Real-time global intelligence from 150+ sources">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <title>World Signal Feed</title>
</head>
<body>

<div id="status-strip">
  <span id="shown-count">0 shown</span>
  <span class="strip-dot">·</span>
  <span id="last-fetch">Starting…</span>
  <div id="lang-wrap">
    <button id="lang-btn">EN</button>
    <div id="lang-dropdown" class="hidden">
      <button class="lang-opt active" data-lang="en">EN — English</button>
      <button class="lang-opt" data-lang="bn">বাং — Bengali</button>
    </div>
  </div>
</div>

<div id="feed">
  <div id="loading">
    <div class="spinner"></div>
    Fetching news for you. Read it. Enjoy it.
  </div>
  <div id="sentinel"></div>
  <div id="search-not-found" class="hidden">Not found!</div>
</div>

<div id="search-bar" class="hidden">
  <input id="search-input" type="search" autocomplete="off" autocorrect="off"
         spellcheck="false" placeholder="Source or keyword — Enter to fetch live">
</div>

<div id="install-banner" class="hidden">
  <span>Add World Signal to your home screen</span>
  <button id="install-btn">Install</button>
</div>

<div id="action-bar">
  <button class="action-btn" id="btn-search" aria-label="Search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Search</span>
  </button>
</div>

<div id="cat-bar">
  <button class="cat-tab active" data-cat="all">All</button>
  <!-- <button class="cat-tab" data-cat="world">World</button> -->
  <!-- <button class="cat-tab" data-cat="india">India</button> -->
  <button class="cat-tab" data-cat="politics">Politics</button>
  <button class="cat-tab" data-cat="sports">Sports</button>
  <button class="cat-tab" data-cat="tech">Tech</button>
  <button class="cat-tab" data-cat="finance">Finance</button>
  <button class="cat-tab" data-cat="science">Science</button>
  <button class="cat-tab" data-cat="health">Health</button>
  <button class="cat-tab" data-cat="entertainment">Entertainment</button>
  <!-- <button class="cat-tab" data-cat="fashion">Fashion</button> -->
  <!-- <button class="cat-tab" data-cat="explore">Explore</button> -->
  <button class="cat-tab" data-cat="nature">Nature</button>
</div>

<!-- Disclaimer modal -->
<div id="disclaimer-overlay">
  <div id="disclaimer">
    <div id="disclaimer-title">Heads up</div>
    <div id="disclaimer-body">Headlines are auto-categorized from multiple sources. Some articles may appear in the wrong category.</div>
    <button id="disclaimer-ok">OK, Got it</button>
  </div>
</div>

<!-- Article modal -->
<div id="modal-overlay" class="hidden" role="dialog" aria-modal="true">
  <div id="modal">
    <div id="modal-meta">
      <span id="modal-source"></span>
      <span id="modal-age"></span>
    </div>
    <div id="modal-title"></div>
    <div id="modal-desc"></div>
    <a id="modal-link" target="_blank" rel="noopener noreferrer">Read Full Article</a>
    <button id="modal-close">Close</button>
  </div>
</div>

<script src="/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
